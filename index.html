<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explorador de Países — Consumo de API REST con Vue 3 y fetch()" />
  <title>Explorador de Países · Vue 3 + fetch()</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>" />
  <link rel="stylesheet" href="./css/styles.css" />

  <!-- Mapa de importaciones: permite hacer "import { ... } from 'vue'" -->
  <script type="importmap">
  {
    "imports": {
      "vue": "https://cdn.jsdelivr.net/npm/vue@3.4.27/dist/vue.esm-browser.js"
    }
  }
  </script>
</head>
<body>
  <!-- Punto de montaje de la aplicación Vue -->
  <div id="app">
    <!-- Contenido mostrado antes de que Vue cargue (sin parpadeo) -->
    <noscript>
      <p style="text-align:center;padding:2rem;">
        Esta aplicación requiere JavaScript habilitado.
      </p>
    </noscript>
  </div>

  <!-- Aplicación Vue (módulo ES). Se ejecuta en diferido, tras parsear el DOM. -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
